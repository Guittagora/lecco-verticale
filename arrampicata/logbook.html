<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logbook · Lecco Verticale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script>
    try { const t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body data-root="../" data-pagina="arrampicata" data-sotto="logbook" data-titolo="Logbook">
  <div id="header"></div>

  <main>
    <section class="page-hero">
      <div class="contenitore">
        <p class="occhiello">Arrampicata</p>
        <h1>Il mio logbook</h1>
        <p>Le vie che hai fatto e le tue recensioni. Restano salvate solo in questo browser: per spostarle su un altro dispositivo usa Esporta e Importa.</p>
      </div>
    </section>
    <div id="subnav" data-sezione="arrampicata"></div>

    <section class="sezione contenitore" style="padding-top:32px">
      <div id="statistiche"></div>

      <div class="logbook-azioni">
        <button class="btn btn-pieno" id="esporta" type="button">Esporta il logbook</button>
        <button class="btn btn-chiaro-scuro" id="importa" type="button">Importa un file</button>
        <input type="file" id="file-importa" accept="application/json,.json" hidden>
        <span class="nota" id="messaggio" role="status" style="margin:0"></span>
      </div>

      <div id="elenco"></div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="../js/config.js"></script>
  <script src="../js/main.js"></script>
  <script src="../data/falesie.js"></script>
  <script src="../js/arrampicata-comune.js"></script>
  <script src="../js/logbook.js"></script>
</body>
</html>
