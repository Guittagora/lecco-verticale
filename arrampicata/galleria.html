<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galleria falesie · Lecco Verticale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script>
    try { const t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body data-root="../" data-pagina="arrampicata" data-sotto="galleria" data-titolo="Galleria falesie">
  <div id="header"></div>

  <main>
    <section class="page-hero">
      <div class="contenitore">
        <p class="occhiello">Arrampicata</p>
        <h1>Galleria</h1>
        <p>Le falesie in foto. Clicca su un'immagine per aprire la scheda della falesia.</p>
      </div>
    </section>
    <div id="subnav" data-sezione="arrampicata"></div>

    <section class="sezione contenitore">
      <div class="filtri">
        <div>
          <span class="etichetta">Falesia</span>
          <div class="chips" id="filtro"></div>
        </div>
      </div>
      <div class="griglia-foto" id="griglia"></div>
      <p class="fonte" id="crediti"></p>
    </section>
  </main>

  <div id="footer"></div>

  <script src="../js/config.js"></script>
  <script src="../js/main.js"></script>
  <script src="../data/falesie.js"></script>
  <script src="../js/arrampicata-comune.js"></script>
  <script src="../js/galleria-arrampicata.js"></script>
</body>
</html>
