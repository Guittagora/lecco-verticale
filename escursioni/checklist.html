<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checklist zaino · Lecco Verticale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script>
    try { const t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body data-root="../" data-pagina="escursioni" data-sotto="checklist" data-titolo="Checklist zaino">
  <div id="header"></div>

  <main>
    <section class="page-hero">
      <div class="contenitore">
        <p class="occhiello">Escursioni</p>
        <h1>Checklist zaino</h1>
        <p>Spunta quello che hai già preparato. Le tue scelte restano salvate in questo browser.</p>
      </div>
    </section>
    <div id="subnav" data-sezione="escursioni"></div>

    <div class="checklist-cima">
      <div class="contenitore">
        <div class="progresso-riga">
          <span id="testo-progresso">0 di 0 pronte</span>
          <button class="btn-testo" id="azzera" type="button">Azzera spunte</button>
        </div>
        <div class="progresso" role="progressbar" aria-label="Avanzamento" aria-valuemin="0" aria-valuemax="100" id="barra"><div id="barra-riempimento"></div></div>
      </div>
    </div>

    <section class="sezione contenitore" style="padding-top:8px">
      <div class="checklist-griglia" id="gruppi"></div>

      <form class="aggiungi" id="form-aggiungi">
        <input class="campo-testo" id="nuova-voce" type="text" placeholder="Aggiungi una voce tua" maxlength="60" aria-label="Nuova voce">
        <select id="nuova-cat" aria-label="Categoria"></select>
        <button class="btn btn-pieno" type="submit">Aggiungi</button>
      </form>
    </section>
  </main>

  <div id="footer"></div>

  <script src="../js/config.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/checklist.js"></script>
</body>
</html>
